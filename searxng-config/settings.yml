use_default_settings: true
general:
  instance_name: "Hermes Search"
  debug: false
  privacypolicy_url: false
  contact_url: false
  enable_metrics: false
search:
  safe_search: 0
  autocomplete: ""
  formats:
    - html
    - json
server:
  secret_key: "${SEARXNG_SECRET_KEY:-hermes-4f7a2b9c1d3e5f6a8b0c2d4e6f1a3b5c7d9e0f2a4b6c8d1e3f5a7b9c0d2e4f6}"
